name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: generated protocol files are committed and current
        run: git diff --exit-code packages/agent/src/generated packages/protocol/src/generated
      - name: types, agent gate (ES5 syntax + ES5 built-ins + 15 KB gzip budget), ES5 runtime
        run: npm run check
      - run: npm test

  old-v8:
    # Runs the agent's ring + encoder on Node 4 (V8 4.5, close to Chromium 45) as an early
    # warning for engine-era problems. Real devices remain the final judge.
    # Uses `docker run` rather than `container:` because node:4 (Debian jessie) is too old for
    # the runner's own Node, which actions/checkout needs inside a job container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/w" -w /w node:4 node packages/agent/test-es5/run.js
      - name: deopt report (informational)
        run: docker run --rm -v "$PWD:/w" -w /w node:4 node --trace-deopt packages/agent/test-es5/run.js | grep -i deopt | head -50 || true

  package:
    # Installs the published package the way users do, and runs the command it promises.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack -w tlpt -w @tlpt/agent --pack-destination "$RUNNER_TEMP"
      - name: install into a fresh project and run tlpt
        run: |
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install -D "$RUNNER_TEMP"/tlpt-0*.tgz "$RUNNER_TEMP"/tlpt-agent-*.tgz
          npx tlpt --help
          node -e "import('tlpt').then((m) => { if (typeof m.startDevServer !== 'function') process.exit(1) })"
          node -e "require('@tlpt/agent')"
      - name: install globally as a bare command, beside another program named teleport
        run: |
          # Gravitational Teleport installs a `teleport` binary. Elsewhere on PATH, whichever folder comes
          # first answers to `teleport`, and tlpt always works.
          other="$RUNNER_TEMP/other" && mkdir -p "$other"
          printf '#!/bin/sh\necho other teleport\n' > "$other/teleport" && chmod +x "$other/teleport"
          prefix="$RUNNER_TEMP/global"
          npm install -g --prefix "$prefix" "$RUNNER_TEMP"/tlpt-0*.tgz
          "$prefix/bin/tlpt" --help
          "$prefix/bin/tlpt" q --help
          test "$(PATH="$other:$prefix/bin:$PATH" teleport)" = "other teleport"
          PATH="$prefix/bin:$other:$PATH" teleport --version
      - name: npm refuses to install over another teleport in its own bin folder, and leaves it alone
        run: |
          same="$RUNNER_TEMP/same" && mkdir -p "$same/bin"
          printf '#!/bin/sh\necho other teleport\n' > "$same/bin/teleport" && chmod +x "$same/bin/teleport"
          if npm install -g --prefix "$same" "$RUNNER_TEMP"/tlpt-0*.tgz; then
            echo "npm installed over another program's teleport" && exit 1
          fi
          test "$("$same/bin/teleport")" = "other teleport"

  installers:
    # tlpt has no dependencies, so any package manager can install it. This proves it for the ones
    # people use besides npm, and that the command also runs on Bun's runtime, not only Node's.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        pm: [bun, pnpm, yarn]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.pm == 'bun'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: matrix.pm == 'pnpm'
        with:
          version: 10
      - run: npm ci
      - run: npm run build
      - run: npm pack -w tlpt -w @tlpt/agent --pack-destination "$RUNNER_TEMP"
      - name: install into a fresh project with ${{ matrix.pm }} and run tlpt
        run: |
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          echo '{"name":"app","private":true}' > package.json
          tlpt="$(ls "$RUNNER_TEMP"/tlpt-0*.tgz)" agent="$(ls "$RUNNER_TEMP"/tlpt-agent-*.tgz)"
          case "${{ matrix.pm }}" in
            bun)  bun add -d "$tlpt" "$agent" && bunx tlpt --help && bun --bun node_modules/.bin/tlpt q --help ;;
            pnpm) pnpm add -D "$tlpt" "$agent" && pnpm exec tlpt --help ;;
            yarn) yarn add -D "$tlpt" "$agent" && yarn -s tlpt --help ;;
          esac
          node -e "import('tlpt').then((m) => { if (typeof m.startDevServer !== 'function') process.exit(1) })"
          node -e "require('@tlpt/agent')"
